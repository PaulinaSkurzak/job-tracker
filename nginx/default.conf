# Lets the Next.js dev server's live reload (a WebSocket) pass through nginx.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The scheme the browser used. In production Caddy terminates HTTPS and sends X-Forwarded-Proto: https;
# locally there is no Caddy, so fall back to nginx's own scheme (http).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # nginx serves Django's static files (admin, API docs) itself; much faster than going through Django.
    location /static/ {
        alias /staticfiles/;
    }

    # Django: the JSON API and the admin.
    location ~ ^/(api|admin)/ {
        proxy_pass http://web:8000;
    }

    # Everything else is the Next.js frontend. Same origin as the API, so cookies work without CORS.
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
