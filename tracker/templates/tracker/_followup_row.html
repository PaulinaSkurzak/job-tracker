<div class="row">
  <div>
    <a href="{% url 'contact_detail' item.contact.pk %}">{{ item.contact.name }}</a>
    {% if item.contact.company %}<span class="muted">({{ item.contact.company.name }})</span>{% endif %}
    <div class="muted">{{ item.get_kind_display }} on {{ item.date|date:"M j" }}{% if item.notes %}: {{ item.notes|truncatechars:80 }}{% endif %}</div>
  </div>
  <div class="row-right">
    <span class="{% if overdue %}late{% else %}muted{% endif %}">follow up {{ item.follow_up_date|date:"M j" }}</span>
    <form method="post" action="{% url 'interaction_done' item.pk %}" class="inline">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <button type="submit" class="link">Mark done</button>
    </form>
  </div>
</div>
