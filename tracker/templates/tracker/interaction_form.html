{% extends "tracker/base.html" %}
{% block title %}Log interaction | Job Tracker{% endblock %}

{% block content %}
<div class="panel">
  <h1>Log interaction with {{ contact.name }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <div class="actions">
      <button type="submit" class="primary">Save</button>
      <a href="{% url 'contact_detail' contact.pk %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
