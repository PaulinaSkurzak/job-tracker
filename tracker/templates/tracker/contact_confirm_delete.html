{% extends "tracker/base.html" %}
{% block title %}Delete contact | Job Tracker{% endblock %}

{% block content %}
<div class="panel">
  <h1>Delete this contact?</h1>
  <p><strong>{{ object }}</strong> and all logged interactions will be permanently deleted.</p>
  <form method="post">
    {% csrf_token %}
    <div class="actions">
      <button type="submit" class="danger-button">Yes, delete</button>
      <a href="{% url 'contact_detail' object.pk %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
