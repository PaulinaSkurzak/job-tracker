name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway Postgres for the test run, the same major version as docker-compose.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jobtracker
          POSTGRES_USER: jobtracker
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobtracker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Fail if personal data or secrets are committed
        # Database backups hold real data (including password hashes) and .env holds secrets.
        run: |
          if git ls-files | grep -E '(^|/)backups/|\.dump$|\.sql$|(^|/)\.env$'; then
            echo "These files must never be committed (see .gitignore)." && exit 1
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      - name: Fail if a model change is missing its migration
        run: python manage.py makemigrations --check --dry-run

      - name: Fail if the committed API schema is out of date with the code
        # The frontend's TypeScript types are generated from frontend/openapi.yml, so it must match the API.
        run: |
          python manage.py spectacular --validate --fail-on-warn --file frontend/openapi.yml
          git diff --exit-code frontend/openapi.yml || (echo "Run: python manage.py spectacular --file frontend/openapi.yml" && exit 1)

      - name: Run tests
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fail if the generated API types are out of date with the schema
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api/schema.d.ts || (echo "Run: npm run gen:api" && exit 1)

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate and build the Compose stack
        run: |
          cp .env.example .env
          docker compose config --quiet
          DOMAIN=jobs.example.com docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          docker compose build
